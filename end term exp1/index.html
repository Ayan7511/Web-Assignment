<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Golden Fork | Restaurant</title>
    <!-- Linking to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-text">
            <h1>The Golden Fork</h1>
            <p>Experience Culinary Excellence</p>
            <a href="https://www.opentable.com" class="btn">Reserve a Table</a>
        </div>
    </header>

    <!-- Menu Section -->
    <section class="container">
        <h2>Our Seasonal Menu</h2>
        <ul class="menu-grid">
            <li class="menu-card">
                <img src="images 2.jpeg" alt="Healthy Bowl">
                <div class="card-content">
                    <h3>Garden Harvest Bowl <span>$14</span></h3>
                    <p>Quinoa, roasted sweet potato, kale, and lemon-tahini dressing.</p>
                </div>
            </li>
            <li class="menu-card">
                <img src="images.jpeg" alt="Grilled Steak">
                <div class="card-content">
                    <h3>Angus Sirloin Steak <span>$28</span></h3>
                    <p>8oz grass-fed sirloin served with garlic butter and asparagus.</p>
                </div>
            </li>
        </ul>
    </section>

</body>
</html>
